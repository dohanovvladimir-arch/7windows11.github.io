<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Windows11's Site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* Reset default margins and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Vibrant abstract background to showcase the glass blur effect */
            background: linear-gradient(135px, #0078d7 0%, #00bcf2 40%, #00b294 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Windows Aero Glass Effect */
        .aero-topbar {
            /* Semi-transparent white background */
            background: rgba(255, 255, 255, 0.25); 
            
            /* Blurs everything behind the panel */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            /* Alignment */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
            
            /* Fixed position */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            /* Glossy borders and window shadows */
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* Logo with Black Text */
        .logo a {
            color: #1a1a1a; /* Dark charcoal/black color */
            font-size: 22px;
            font-weight: 600;
            text-decoration: none;
            /* Light backing glow to keep text readable against dark backgrounds */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* Navigation Links Container */
        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 15px;
        }

        /* Links with Black Text */
        .nav-links a {
            color: #222222; /* Dark grey/black color */
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid transparent;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6); /* Text highlight */
            transition: all 0.2s ease-in-out;
        }

        /* Hover Effect for Links */
        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 0 5px rgba(255, 255, 255, 0.2);
            color: #000000; /* Pure black on hover */
            text-shadow: 0 0 8px rgba(255, 255, 255, 1);
        }

        /* Content Area Spacer */
        .content {
            margin-top: 100px;
            padding: 30px;
        }

        /* Aero Content Box with Black Text */
        .content-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 25px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            color: #222222; /* Dark text for the main body */
        }

        .content-box h1 {
            margin-bottom: 15px;
            font-weight: 600;
            color: #1a1a1a;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Aero Topbar -->
    <header class="aero-topbar">
        <div class="logo">
            <a href="#">nothing</a>
        </div>
        <nav>
         <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="desktop.html">Desktop</a></li>
    <li><a href="mfiles.html">Misc Files</a></li>
    <li><a href="about.html">About</a></li>
        </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="content">
        <div class="content-box">
            <h1>Windows Aero Theme</h1>
            <p>This layout uses the modern <code>backdrop-filter</code> CSS property to replicate the iconic translucent glass look from Windows 7 and Windows Vista.</p>
        </div>
    </main>

</body>
</html>
